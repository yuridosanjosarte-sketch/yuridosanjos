<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery | Yuri dos Anjos</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  
<style>

/* RESET */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0d0d0d;
color:#f5f5f5;
font-family:'Inter',sans-serif;
overflow-x:hidden;
}

/* PARTICLES */

#spiritCanvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

/* SCROLL PROGRESS */

.scroll-progress{
position:fixed;
top:0;
left:0;
height:3px;
background:#c49b3d;
width:0%;
z-index:3000;
}

/* HEADER */

header{
text-align:center;
padding:60px 10%;
background:#000;
}

header h1{
font-family:'Cinzel',serif;
font-size:42px;
letter-spacing:6px;
}

/* BACK BUTTON */

.back-btn{
position:fixed;
top:25px;
left:25px;
background:rgba(196,155,61,0.9);
color:#000;
padding:8px 18px;
text-decoration:none;
font-weight:500;
font-size:14px;
border-radius:30px;
backdrop-filter: blur(6px);
transition:all 0.3s ease;
z-index:1000;
}

.back-btn:hover{
background:#e0b94f;
transform:translateY(-2px);
}

/* GALLERY */

.gallery{
padding:140px 10%;
}

/* ART BLOCK */

.art-piece{
max-width:1000px;
margin:0 auto 220px auto;
text-align:center;

opacity:0;
transform:translateY(35px);
filter:blur(6px);

transition:
opacity 2.4s cubic-bezier(.22,.61,.36,1),
transform 2.4s cubic-bezier(.22,.61,.36,1),
filter 2.4s cubic-bezier(.22,.61,.36,1);
}

.art-piece.visible{
opacity:1;
transform:translateY(0);
filter:blur(0);
}

.art-piece img{
width:100%;
margin-bottom:60px;
transition:transform 3s ease;
}

.art-piece img:hover{
transform:scale(1.02);
}

.art-piece h2{
font-family:'Cinzel',serif;
letter-spacing:4px;
}

/* LIGHTBOX */

.lightbox{
position:fixed;
inset:0;
background:radial-gradient(circle at center,#050505,#000);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
opacity:0;
visibility:hidden;
transition:opacity 0.6s ease;
z-index:2000;
backdrop-filter:blur(12px);
overflow:hidden;
}

.lightbox.active{
opacity:1;
visibility:visible;
}

/* IMAGE */

.lightbox img{
max-width:85%;
max-height:55vh;
box-shadow:0 40px 120px rgba(0,0,0,0.9);
border:1px solid rgba(255,255,255,0.08);
cursor:zoom-in;
transition:transform 0.2s ease;
}

/* MUSEUM LIGHT EFFECT */

.lightbox::before{
content:"";
position:absolute;
width:600px;
height:600px;
background:radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%);
pointer-events:none;
mix-blend-mode:soft-light;
transform:translate(-50%,-50%);
}

/* TITLE */

#lightbox-title{
margin-top:30px;
font-family:'Cinzel',serif;
letter-spacing:4px;
font-size:20px;
opacity:0.85;
}

/* CLOSE */

.close{
position:absolute;
top:40px;
right:60px;
font-size:40px;
color:#fff;
cursor:pointer;
}

/* NAVIGATION */

.nav{
position:absolute;
top:50%;
transform:translateY(-50%);
font-size:45px;
color:white;
cursor:pointer;
padding:20px;
user-select:none;
opacity:0.6;
transition:0.3s;
}

.nav:hover{
opacity:1;
}

.prev{
left:40px;
}

.next{
right:40px;
}

/* MOBILE */

@media (max-width:480px){

.back-btn{
top:12px;
left:12px;
padding:5px 12px;
font-size:11px;
}

header{
padding:90px 8% 40px 8%;
}

header h1{
font-size:30px;
letter-spacing:4px;
}

}

/* REMOVE TAP HIGHLIGHT MOBILE */

*{
-webkit-tap-highlight-color: transparent;
}

/* ================= CURSOR ART ================= */

.art-cursor{
position:fixed;
width:18px;
height:18px;
border:2px solid #c49b3d;
border-radius:50%;
pointer-events:none;
transform:translate(-50%,-50%);
z-index:9999;
transition:
transform .15s ease,
width .25s ease,
height .25s ease,
background .25s ease;
}

.art-cursor.expand{
width:38px;
height:38px;
background:rgba(196,155,61,0.15);
}

/* remove no mobile */

@media (hover: none) and (pointer: coarse){
.art-cursor{
display:none !important;
}
}

/* ================= ART STORY ================= */

.art-story{
max-width:900px;
width:85%;
margin-top:15px;
background:rgba(0,0,0,0.55);
border:1px solid rgba(196,155,61,0.25);
backdrop-filter:blur(12px);
border-radius:14px;
box-shadow:0 20px 60px rgba(0,0,0,0.8);
overflow:hidden;
}

.story-scroll{
max-height:180px;
overflow-y:auto;
padding:28px 34px;
scroll-behavior:smooth;  
}

.story-scroll::-webkit-scrollbar{
width:6px;
}

.story-scroll::-webkit-scrollbar-thumb{
background:#c49b3d;
border-radius:10px;
}

.story-scroll p{
font-family:'Cinzel',serif;
font-size:16px;
line-height:1.8;
letter-spacing:0.5px;
color:#eaeaea;
opacity:0.9;
}

/* MOBILE */

@media(max-width:768px){

.story-scroll{
max-height:220px;
padding:22px;
}

.story-scroll p{
font-size:15px;
line-height:1.7;
}

}

#story-title{
font-family:'Cinzel',serif;
font-size:22px;
letter-spacing:3px;
margin-bottom:18px;
color:#c49b3d;
}
  
</style>
</head>

<body>

<canvas id="spiritCanvas"></canvas>

<div class="art-cursor"></div> 

<div class="scroll-progress"></div>

<a href="index.html" class="back-btn">Back to Home</a>

<header>
<h1>Gallery</h1>
</header>

<section class="gallery">

<div class="art-piece">
<img src="etsa-ara.jpg" alt="Etsá Ara">
<h2>Etsá Ara – Eyes of the Sky</h2>
</div>

<div class="art-piece">
<img src="o-espirito.png" alt="O Espírito">
<h2>The Spirit</h2>
</div>

<div class="art-piece">
<img src="ipytue.jpg" alt="Ipytuẽ">
<h2>Ipytuẽ – Breathe</h2>
</div>

<div class="art-piece">
<img src="kiririndju.jpg" alt="Kiririndju">
<h2>Kiririndju</h2>
</div>

<div class="art-piece">
<img src="djera-poty.jpg" alt="Djera Poty">
<h2>Djera Poty</h2>
</div>

<div class="art-piece">
<img src="mariposa.jpg" alt="Mariposa">
<h2>Mariposa</h2>
</div>

<div class="art-piece">
<img src="obras-e-autor.jpg" alt="Artist and Works">
<h2>Artist & Works</h2>
</div>

</section>

<div class="lightbox" id="lightbox">

<span class="close">&times;</span>

<div class="nav prev">&#10094;</div>
<div class="nav next">&#10095;</div>

<img src="" id="lightbox-img">

<div class="art-story">
<div class="story-scroll">

<h3 id="story-title"></h3>

<p id="story-text"></p>

</div>
</div>

</div>

<script>

/* LIGHTBOX */

const images=document.querySelectorAll(".art-piece img")
const titles=document.querySelectorAll(".art-piece h2")

const lightbox=document.getElementById("lightbox")
const lightboxImg=document.getElementById("lightbox-img")

const closeBtn=document.querySelector(".close")
const nextBtn=document.querySelector(".next")
const prevBtn=document.querySelector(".prev")

/* ================= ART STORIES ================= */

const stories=[

`On a night when the moon wandered alone above the forest, Djatsy stepped out of her hut and walked toward the river. She was pregnant, and her heart carried ancient prayers.
The sky was clear.
The stars glowed like cool embers scattered across the darkness.
Djatsy knelt at the water’s edge and spoke her prayer to Nhanderu Tupã:
— May my daughter carry light within her, even when the night is deepest.
The river grew silent.
The wind faded.
Then the stars began to move across the surface of the water, as if they were no longer in the sky, but resting inside the river itself.
One of them shone brighter than the others.
It did not fall.
It did not cross the heavens.
Instead, it descended like a living reflection and touched Djatsy’s womb through the water.
That night, the sky did not mark the child with its color.
It marked her with its memory.
Months later, when the girl was born, the people gathered quietly around her.
Her eyes were not the color of the earth.
Nor the forest.
Nor the river.
They were pale like starlight reflected on dark water — bluish-white, almost silver, like a light that does not entirely belong to this world.
The elders spoke softly among themselves:
— She is Etsá Ara.
— The Eyes of the Sky.
And it is said that when Etsá Ara looks deeply at someone, it is not only a child who is watching.
It is ancient stars shining through her.
.
.
(The legend above is an original work created by me, Yuri Dos Anjos, and is not copied or adapted from any other source.) ©️`,

`The Spirit

COLE A HISTÓRIA DA OBRA THE SPIRIT AQUI.`,

`Ipytuẽ – Breathe

COLE A HISTÓRIA DA OBRA IPYTUẼ AQUI.`,

`

João Gomes (Awa Kiririndju) was a great chief and respected leader of the Tupi Indigenous community Pakowaty, in Peruíbe, Brazil, during the early years of the XXI century. He was also the grandfather of the artist Yuri dos Anjos.

Kiririndju was known among his people for his profound wisdom and spiritual strength. Beyond his role as a chief, he was also a Pajé — a spiritual healer — with deep knowledge of medicinal plants and the healing traditions of his ancestors. Through remedies he prepared with his own hands, he helped many people recover from illness, including those who came from outside the village seeking guidance and healing.

Kiririndju passed away in 2006. His departure left a deep silence among those who knew him. Yet his wisdom, his teachings, and his devotion to helping others continue to live on through memory, tradition, and the spirit of the forest he once walked.
`,

`Djera Poty

COLE A HISTÓRIA DA OBRA DJERA POTY AQUI.`,

`Mariposa

COLE A HISTÓRIA DA OBRA MARIPOSA AQUI.`,

`Artist & Works

COLE A HISTÓRIA SOBRE O ARTISTA E AS OBRAS AQUI.`

]; 

let currentIndex=0

function openLightbox(index){

currentIndex=index

lightbox.classList.add("active")

lightboxImg.src=images[index].src
document.getElementById("story-title").textContent = titles[index].textContent

document.getElementById("story-text").textContent=stories[index]
  
resetZoom()

}

function showNext(){

currentIndex++
if(currentIndex>=images.length) currentIndex=0

openLightbox(currentIndex)

}

function showPrev(){

currentIndex--
if(currentIndex<0) currentIndex=images.length-1

openLightbox(currentIndex)

}

images.forEach((img,i)=>{
img.addEventListener("click",()=>{
openLightbox(i)
})
})

closeBtn.addEventListener("click",()=>{
lightbox.classList.remove("active")
resetZoom()
})

nextBtn.addEventListener("click",showNext)
prevBtn.addEventListener("click",showPrev)

/* KEYBOARD */

document.addEventListener("keydown",(e)=>{

if(!lightbox.classList.contains("active")) return

if(e.key==="ArrowRight") showNext()
if(e.key==="ArrowLeft") showPrev()
if(e.key==="Escape"){
lightbox.classList.remove("active")
resetZoom()
}

})

/* ========================= */
/* ADVANCED ZOOM + DRAG */
/* ========================= */

let zoom=false
let scale=2
let posX=0
let posY=0

let dragging=false
let startX=0
let startY=0

function updateTransform(){

lightboxImg.style.transform=
`translate(${posX}px, ${posY}px) scale(${zoom?scale:1})`

}

function resetZoom(){

zoom=false
posX=0
posY=0

lightboxImg.style.cursor="zoom-in"

updateTransform()

}

lightboxImg.addEventListener("click",(e)=>{

if(!zoom){

zoom=true
lightboxImg.style.cursor="grab"

const rect=lightboxImg.getBoundingClientRect()

const offsetX=e.clientX-rect.left
const offsetY=e.clientY-rect.top

posX=(rect.width/2-offsetX)
posY=(rect.height/2-offsetY)

updateTransform()

}else{

resetZoom()

}

})

/* DRAG */

lightboxImg.addEventListener("mousedown",(e)=>{

if(!zoom) return

dragging=true

lightboxImg.style.cursor="grabbing"

startX=e.clientX-posX
startY=e.clientY-posY

})

window.addEventListener("mousemove",(e)=>{

if(!dragging) return

posX=e.clientX-startX
posY=e.clientY-startY

updateTransform()

})

window.addEventListener("mouseup",()=>{

dragging=false

if(zoom) lightboxImg.style.cursor="grab"

})

/* SCROLL REVEAL */

const artObserver=new IntersectionObserver((entries)=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add("visible")
}
})
},{threshold:0.2})

document.querySelectorAll(".art-piece")
.forEach(el=>artObserver.observe(el))

/* SCROLL PROGRESS */

window.addEventListener("scroll",()=>{

const scrollTop=document.documentElement.scrollTop
const height=document.documentElement.scrollHeight-document.documentElement.clientHeight

const progress=(scrollTop/height)*100

document.querySelector(".scroll-progress").style.width=progress+"%"

})

/* ================= GOLD DUST BACKGROUND ================= */

let isMouseDown=false;
  
const canvas=document.getElementById("spiritCanvas");
const ctx=canvas.getContext("2d");

let width=canvas.width=window.innerWidth;
let height=canvas.height=window.innerHeight;

window.addEventListener("resize",()=>{
width=canvas.width=window.innerWidth;
height=canvas.height=window.innerHeight;
});

const particles=[];
const numParticles=80;

for(let i=0;i<numParticles;i++){
particles.push({
x: Math.random()*width,
y: Math.random()*height,
vx: (Math.random()-0.5)*0.25,
vy: (Math.random()-0.5)*0.25,
size: Math.random()*1.5+0.8,
alpha: Math.random()*0.9+0.3
});
}

const mouse={x:-9999,y:-9999};

window.addEventListener("mousemove",(e)=>{
mouse.x=e.clientX;
mouse.y=e.clientY;
});

window.addEventListener("touchmove",(e)=>{
if(e.touches.length>0){
mouse.x=e.touches[0].clientX;
mouse.y=e.touches[0].clientY;
}
},{passive:true});
  
function animate(){

ctx.clearRect(0,0,width,height);

particles.forEach(p=>{

p.x += p.vx + Math.sin(Date.now()*0.001+p.vx)*0.2;
p.y += p.vy + Math.cos(Date.now()*0.001+p.vy)*0.2;

if(p.x>width) p.x=0;
if(p.x<0) p.x=width;
if(p.y>height) p.y=0;
if(p.y<0) p.y=height;

let dx=p.x-mouse.x;
let dy=p.y-mouse.y;
let dist=Math.sqrt(dx*dx+dy*dy);

let activeRadius=isMouseDown ? 150 : 80;

if(dist<activeRadius){

let angle=Math.atan2(dy,dx);
let force=(activeRadius-dist)/activeRadius;

p.x += Math.cos(angle)*force*6;
p.y += Math.sin(angle)*force*6;

}

ctx.beginPath();
ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
ctx.fillStyle=`rgba(255,215,0,${p.alpha})`;
ctx.shadowColor="rgba(255,215,0,0.9)";
ctx.shadowBlur=6;
ctx.fill();
ctx.closePath();

});

requestAnimationFrame(animate);

}

animate();

/* ================= ART CURSOR ================= */

if (!('ontouchstart' in window)) {

const cursor=document.querySelector(".art-cursor");

window.addEventListener("mousemove",e=>{
cursor.style.left=e.clientX+"px";
cursor.style.top=e.clientY+"px";
});

document.querySelectorAll("img,.back-btn,.nav,.close").forEach(el=>{
el.addEventListener("mouseenter",()=>{cursor.classList.add("expand");});
el.addEventListener("mouseleave",()=>{cursor.classList.remove("expand");});
});

window.addEventListener("mousedown",e=>{
if(e.button===0){ 
isMouseDown=true;
cursor.classList.add("expand");
}
});

window.addEventListener("mouseup",e=>{
if(e.button===0){ 
isMouseDown=false;
cursor.classList.remove("expand");
}
});

}
  
</script>

</body>
</html>
