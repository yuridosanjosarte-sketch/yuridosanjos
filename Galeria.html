<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Yuri dos Anjos</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0d0d0d;
  color:#f5f5f5;
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
}

/* PARTICLES */
#spiritCanvas{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-1;
}

/* SCROLL PROGRESS */
.scroll-progress{
  position:fixed;
  top:0;
  left:0;
  height:3px;
  background:#c49b3d;
  width:0%;
  z-index:3000;
}

/* HEADER */
header{
  text-align:center;
  padding:60px 10%;
  background:#000;
}

header h1{
  font-family:'Cinzel',serif;
  font-size:42px;
  letter-spacing:6px;
}

/* BACK BUTTON */
.back-btn{
  position:fixed;
  top:25px;
  left:25px;
  background:rgba(196,155,61,0.9);
  color:#000;
  padding:8px 18px;
  text-decoration:none;
  font-weight:500;
  font-size:14px;
  border-radius:30px;
  backdrop-filter: blur(6px);
  transition:all 0.3s ease;
  z-index:1000;
}
.back-btn:hover{
  background:#e0b94f;
  transform:translateY(-2px);
}

/* GALLERY */
.gallery{
  padding:140px 10%;
}

/* ART BLOCK */
.art-piece{
  max-width:1000px;
  margin:0 auto 220px auto;
  text-align:center;

  opacity:0;
  transform:translateY(35px);
  filter:blur(6px);

  transition:
    opacity 2.4s cubic-bezier(.22,.61,.36,1),
    transform 2.4s cubic-bezier(.22,.61,.36,1),
    filter 2.4s cubic-bezier(.22,.61,.36,1);
}
.art-piece.visible{
  opacity:1;
  transform:translateY(0);
  filter:blur(0);
}
.art-piece img{
  width:100%;
  margin-bottom:60px;
  transition:transform 3s ease;
}
.art-piece img:hover{
  transform:scale(1.02);
}
.art-piece h2{
  font-family:'Cinzel',serif;
  letter-spacing:4px;
}

/* LIGHTBOX */
.lightbox{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center,#050505,#000);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  opacity:0;
  visibility:hidden;
  transition:opacity 0.6s ease;
  z-index:2000;
  backdrop-filter:blur(12px);
  overflow:hidden;
}
.lightbox.active{
  opacity:1;
  visibility:visible;
}
.lightbox img{
  max-width:85%;
  max-height:80%;
  box-shadow:0 40px 120px rgba(0,0,0,0.9);
  border:1px solid rgba(255,255,255,0.08);
  cursor:zoom-in;
  transition:transform 0.2s ease;
}
.lightbox::before{
  content:"";
  position:absolute;
  width:600px;
  height:600px;
  background:radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%);
  pointer-events:none;
  mix-blend-mode:soft-light;
  transform:translate(-50%,-50%);
}
#lightbox-title{
  margin-top:30px;
  font-family:'Cinzel',serif;
  letter-spacing:4px;
  font-size:20px;
  opacity:0.85;
}
.close{
  position:absolute;
  top:40px;
  right:60px;
  font-size:40px;
  color:#fff;
  cursor:pointer;
}
.nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:45px;
  color:white;
  cursor:pointer;
  padding:20px;
  user-select:none;
  opacity:0.6;
  transition:0.3s;
}
.nav:hover{
  opacity:1;
}
.prev{
  left:40px;
}
.next{
  right:40px;
}

/* MOBILE */
@media (max-width:480px){
  .back-btn{
    top:12px;
    left:12px;
    padding:5px 12px;
    font-size:11px;
  }
  header{
    padding:90px 8% 40px 8%;
  }
  header h1{
    font-size:30px;
    letter-spacing:4px;
  }
}

/* SECRET PARTICLE */
#secretParticle {
  position:fixed;
  width:20px;
  height:20px;
  border-radius:50%;
  background: radial-gradient(circle, #ffd700, #c49b3d);
  box-shadow:0 0 15px #ffd700,0 0 25px #c49b3d;
  cursor:pointer;
  z-index:5000;
  pointer-events:auto;
  display:none;
  animation:secretBlink 1.8s infinite alternate;
}
@keyframes secretBlink{
  0%{opacity:0.3; transform:scale(0.8);}
  100%{opacity:1; transform:scale(1.2);}
}
</style>
</head>

<body>

<canvas id="spiritCanvas"></canvas>

<div class="scroll-progress"></div>

<a href="index.html" class="back-btn">Back to Home</a>

<header>
<h1>Gallery</h1>
</header>

<section class="gallery">
  <div class="art-piece">
    <img src="etsa-ara.jpg" alt="Etsá Ara">
    <h2>Etsá Ara – Eyes of the Sky</h2>
  </div>
  <div class="art-piece">
    <img src="o-espirito.png" alt="O Espírito">
    <h2>The Spirit</h2>
  </div>
  <div class="art-piece">
    <img src="ipytue.jpg" alt="Ipytuẽ">
    <h2>Ipytuẽ – Breathe</h2>
  </div>
  <div class="art-piece">
    <img src="kiririndju.jpg" alt="Kiririndju">
    <h2>Kiririndju</h2>
  </div>
  <div class="art-piece">
    <img src="djera-poty.jpg" alt="Djera Poty">
    <h2>Djera Poty</h2>
  </div>
  <div class="art-piece">
    <img src="mariposa.jpg" alt="Mariposa">
    <h2>Mariposa</h2>
  </div>
  <div class="art-piece">
    <img src="obras-e-autor.jpg" alt="Artist and Works">
    <h2>Artist & Works</h2>
  </div>
</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
<span class="close">&times;</span>
<div class="nav prev">&#10094;</div>
<div class="nav next">&#10095;</div>
<img src="" id="lightbox-img">
<h3 id="lightbox-title"></h3>
</div>

<!-- SECRET PARTICLE -->
<div id="secretParticle"></div>

<script>
/* -------------------- LIGHTBOX -------------------- */
const images=document.querySelectorAll(".art-piece img")
const titles=document.querySelectorAll(".art-piece h2")
const lightbox=document.getElementById("lightbox")
const lightboxImg=document.getElementById("lightbox-img")
const lightboxTitle=document.getElementById("lightbox-title")
const closeBtn=document.querySelector(".close")
const nextBtn=document.querySelector(".next")
const prevBtn=document.querySelector(".prev")
let currentIndex=0
function openLightbox(index){
  currentIndex=index
  lightbox.classList.add("active")
  lightboxImg.src=images[index].src
  lightboxTitle.textContent=titles[index].textContent
  resetZoom()
}
function showNext(){currentIndex++; if(currentIndex>=images.length) currentIndex=0; openLightbox(currentIndex)}
function showPrev(){currentIndex--; if(currentIndex<0) currentIndex=images.length-1; openLightbox(currentIndex)}
images.forEach((img,i)=>{img.addEventListener("click",()=>{openLightbox(i)})})
closeBtn.addEventListener("click",()=>{lightbox.classList.remove("active"); resetZoom()})
nextBtn.addEventListener("click",showNext)
prevBtn.addEventListener("click",showPrev)
document.addEventListener("keydown",(e)=>{
  if(!lightbox.classList.contains("active")) return
  if(e.key==="ArrowRight") showNext()
  if(e.key==="ArrowLeft") showPrev()
  if(e.key==="Escape"){ lightbox.classList.remove("active"); resetZoom() }
})

/* -------------------- ZOOM & DRAG -------------------- */
let zoom=false, scale=2, posX=0, posY=0, dragging=false, startX=0, startY=0
function updateTransform(){lightboxImg.style.transform=`translate(${posX}px, ${posY}px) scale(${zoom?scale:1})`}
function resetZoom(){zoom=false; posX=0; posY=0; lightboxImg.style.cursor="zoom-in"; updateTransform()}
lightboxImg.addEventListener("click",(e)=>{
  if(!zoom){ zoom=true; lightboxImg.style.cursor="grab";
    const rect=lightboxImg.getBoundingClientRect()
    const offsetX=e.clientX-rect.left
    const offsetY=e.clientY-rect.top
    posX=(rect.width/2-offsetX)
    posY=(rect.height/2-offsetY)
    updateTransform()
  }else{ resetZoom() }
})
lightboxImg.addEventListener("mousedown",(e)=>{ if(!zoom) return; dragging=true; lightboxImg.style.cursor="grabbing"; startX=e.clientX-posX; startY=e.clientY-posY })
window.addEventListener("mousemove",(e)=>{ if(!dragging) return; posX=e.clientX-startX; posY=e.clientY-startY; updateTransform() })
window.addEventListener("mouseup",()=>{ dragging=false; if(zoom) lightboxImg.style.cursor="grab" })

/* -------------------- SCROLL REVEAL -------------------- */
const artObserver=new IntersectionObserver((entries)=>{
entries.forEach(entry=>{ if(entry.isIntersecting){ entry.target.classList.add("visible") } })
},{threshold:0.2})
document.querySelectorAll(".art-piece").forEach(el=>artObserver.observe(el))

/* -------------------- SCROLL PROGRESS -------------------- */
window.addEventListener("scroll",()=>{
  const scrollTop=document.documentElement.scrollTop
  const height=document.documentElement.scrollHeight-document.documentElement.clientHeight
  const progress=(scrollTop/height)*100
  document.querySelector(".scroll-progress").style.width=progress+"%"
})

/* -------------------- GOLD PARTICLES -------------------- */
const canvas=document.getElementById("spiritCanvas")
const ctx=canvas.getContext("2d")
function resizeCanvas(){canvas.width=window.innerWidth; canvas.height=window.innerHeight}
window.addEventListener("resize",resizeCanvas)
resizeCanvas()
let particles=[]
for(let i=0;i<50;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    size:1+Math.random()*2,
    speed:0.2+Math.random()*0.3,
    vx:(Math.random()-0.5)*0.2,
    vy:(Math.random()-0.5)*0.2
  })
}
const cursor={x:0,y:0,expand:false}
window.addEventListener("mousemove",e=>{cursor.x=e.clientX; cursor.y=e.clientY})
window.addEventListener("mousedown",()=>{cursor.expand=true})
window.addEventListener("mouseup",()=>{cursor.expand=false})
function animateParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height)
  particles.forEach(p=>{
    p.x += p.vx
    p.y -= p.speed + p.vy
    if(p.y<0)p.y=canvas.height
    if(p.x<0)p.x=canvas.width
    if(p.x>canvas.width)p.x=0
    // interaction with cursor
    const dx=p.x-cursor.x
    const dy=p.y-cursor.y
    const dist=Math.sqrt(dx*dx+dy*dy)
    const effect=cursor.expand?80:40
    if(dist<effect){
      p.x += dx/dist*2
      p.y += dy/dist*2
    }
    ctx.beginPath()
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2)
    const glow = Math.random()*0.5+0.5
    ctx.fillStyle=`rgba(255,215,0,${glow})`
    ctx.shadowColor = "#fffacd"
    ctx.shadowBlur = 8
    ctx.fill()
    ctx.shadowBlur = 0
  })
  requestAnimationFrame(animateParticles)
}
animateParticles()

/* -------------------- SECRET PARTICLE -------------------- */
const secretParticle = document.getElementById("secretParticle")
function placeSecretParticle(){
  secretParticle.style.left = Math.random()*(window.innerWidth-40)+"px"
  secretParticle.style.top = Math.random()*(window.innerHeight-40)+"px"
  secretParticle.style.display = "block"
}
// Aparece a cada 1 minuto
setInterval(placeSecretParticle,60000)
secretParticle.addEventListener("click",()=>{
  window.open("game/index.html","_blank")
  secretParticle.style.display="none"
})

</script>
</body>
</html>
