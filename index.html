<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="google" content="notranslate">

<title>Yuri dos Anjos | Indigenous Contemporary Realism</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0d0d0d;
color:#f5f5f5;
font-family:'Inter',sans-serif;
scroll-behavior:smooth;
overflow-x:hidden;
}

/* NAV CONTAINER FIX MOBILE */
.nav-container{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:40px;
}

/* LINKS DOURADOS */
.thanos-link{
position:relative;
color:#c49b3d;
text-decoration:none;
letter-spacing:3px;
font-size:13px;
cursor:pointer;
display:inline-block;
overflow:hidden;
white-space:nowrap;
}

.thanos-link span{
display:inline-block;
}
  
nav a::after{
display:none;
}

/* MOBILE */
@media(max-width:768px){

.nav-container{
flex-direction:column;
align-items:center;
gap:18px;
}

.thanos-link{
font-size:12px;
letter-spacing:2px;
white-space:nowrap;
text-align:center;
}

.art-piece{
margin:0 auto 120px auto;
}  
  
.hero{
background-attachment:scroll;
}

.hero::before{
background-position:center 20%;
}  
  
}
  
/* TOPBAR */
.topbar{
background:#000;
padding:10px 6%;
display:flex;
justify-content:flex-end;
align-items:center;
border-bottom:1px solid #222;
}

/* SOCIAL ICONS */
.socials{
display:flex;
align-items:center;
gap:18px;
}

.socials a{
color:#aaa;
font-size:18px;
transition:0.3s ease;
}

.socials a:hover{
color:#c49b3d;
transform:translateY(-3px);
}

/* HEADER */
header{
text-align:center;
padding:60px 10%;
background:#000;
}

header h1{
font-family:'Cinzel',serif;
font-size:52px;
letter-spacing:8px;
}

header p{
margin-top:15px;
color:#aaa;
letter-spacing:3px;
}

/* NAV */
nav{
background:#111;
padding:18px;
text-align:center;
border-bottom:1px solid #222;
}

nav a:not(.thanos-link){
position:relative;
color:#ccc;
text-decoration:none;
margin:0 35px;
letter-spacing:3px;
font-size:13px;
padding-bottom:6px;
transition:color 0.3s ease;
}

/* HERO */
.hero{
height:95vh;
position:relative;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
}

.hero::before{
content:"";
position:absolute;
inset:0;
background-image:url('etsa-ara.jpg');
background-size:cover;
background-position:center 38%;
filter:brightness(0.55);
z-index:0;
animation:zoom 30s ease-in-out infinite alternate;
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.06);}
}

.hero-content{
position:relative;
z-index:2;
text-align:center;
opacity:0;
transform:translateX(-140px);
transition:
transform 2.2s cubic-bezier(.22,.61,.36,1),
opacity 2.2s cubic-bezier(.22,.61,.36,1);
}

.hero-content.visible{
opacity:1;
transform:translateX(0);
}

.hero-content.hidden{
opacity:0;
transform:translateX(-160px);
}

/* SECTIONS */
section{
padding:160px 10%;
}

/* ABOUT */
#about{
display:flex;
justify-content:center;
}

.aboutcontainer{
max-width:1100px;
display:flex;
gap:60px;
flex-wrap:wrap;
align-items:center;
}

.about-image{
width:320px;
border:2px solid #c49b3d;
}

.about-text{
flex:1;
min-width:300px;
color:#ccc;
line-height:1.8;
}

/* GALLERY */
#gallery h2{
text-align:center;
font-family:'Cinzel',serif;
margin-bottom:160px;
}

.art-piece{
max-width:1000px;
margin:0 auto 220px auto;
text-align:center;
opacity:0;
transform:translateY(35px);
filter:blur(6px);
transition:
opacity 2.4s cubic-bezier(.22,.61,.36,1),
transform 2.4s cubic-bezier(.22,.61,.36,1),
filter 2.4s cubic-bezier(.22,.61,.36,1);
}

.art-piece.visible{
opacity:1;
transform:translateY(0);
filter:blur(0);
}

.art-piece img{
width:100%;
margin-bottom:60px;
transition:transform 3s ease;
}

.art-piece img:hover{
transform:scale(1.02);
}

/* BUTTON */
.button{
display:inline-block;
padding:14px 35px;
background:#c49b3d;
color:#000;
text-decoration:none;
font-weight:600;
}

.button:hover{
background:#e0b94f;
}

/* CONTACT */
#contact{
text-align:center;
}

#contact p{
color:#ccc;
}

/* FOOTER */
footer{
text-align:center;
padding:50px;
background:#000;
border-top:1px solid #222;
color:#666;
}
 
.thanos-link span{
display:inline-block;
transition:
transform 3s cubic-bezier(.19,1,.22,1),
opacity 2.8s ease-out,
filter 2.8s ease-out;
}

.thanos-link.disintegrate span{
opacity:0;
transform:
translate(var(--x), var(--y))
rotate(var(--r))
scale(0.5);
filter:blur(12px);
}

.thanos-link.regenerate span{
opacity:1;
transform:translate(0,0) rotate(0deg) scale(1);
filter:blur(0);
}
  
</style>
</head>
